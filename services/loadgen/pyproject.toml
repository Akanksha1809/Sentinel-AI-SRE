[project]
name = "sentinel-loadgen"
version = "0.1.0"
description = "Deterministic, fixed-rate traffic generator for shop-api"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loadgen"
