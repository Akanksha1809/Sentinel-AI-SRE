[project]
name = "shop-api"
version = "1.0.0"
description = "Instrumented demo checkout service with deterministic, bounded fault modes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "prometheus-client==0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shop_api"
