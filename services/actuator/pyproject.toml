[project]
name = "sentinel-actuator"
version = "0.1.0"
description = "Least-privilege fleet agent: the only component allowed to change demo workloads"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "prometheus-client==0.26.0",
    "httpx==0.28.1",
    "docker==7.2.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "actuator"
