name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, unit & policy tests, security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history for the secret scan below
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Lint
        run: make lint
      - name: Type check (mypy --strict)
        run: make typecheck
      - name: Unit + policy tests
        run: make test-unit
      - name: Security (bandit, pip-audit)
        run: make security
      - name: Secret scan (gitleaks, baseline excludes known test fixtures)
        run: make secret-scan

  integration:
    name: integration & API tests (Postgres via testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Integration + API tests
        run: make test-integration

  monitoring-config:
    name: promtool & amtool
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Prometheus rules, rule unit tests, Alertmanager config
        run: make check-monitoring

  images:
    name: build images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate throwaway secrets (compose validates secret paths)
        run: ./scripts/gen-secrets.sh
      - name: Build service and release images
        run: docker compose -f deploy/compose/docker-compose.yml --profile images build

  e2e:
    name: e2e scenarios (live mode, full Compose stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Generate secrets
        run: ./scripts/gen-secrets.sh
      - name: Build images
        # `up --build` only rebuilds services with their *own* build: stanza -
        # sentinel-api/sentinel-worker/docker-guard just reference sentinel/sentinel:dev
        # and sentinel/actuator:dev by tag, so --build silently skips them and `up`
        # falls back to pulling a nonexistent registry image. Build everything that
        # has a build stanza first (same as the `images` job / `make images`), then
        # `up` without --build so it uses what's already tagged locally.
        run: docker compose -f deploy/compose/docker-compose.yml --profile images build
      - name: Start the stack in live execution mode
        run: SENTINEL_EXECUTION_MODE=live docker compose -f deploy/compose/docker-compose.yml up -d
      - name: Wait for readiness
        run: ./scripts/wait-ready.sh
      - name: Run e2e scenarios
        run: uv run pytest -m e2e -v
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
